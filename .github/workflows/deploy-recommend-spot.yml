# Manual deploy of Edge Function `recommend-spot` to Supabase project.
# Requires repo secret SUPABASE_ACCESS_TOKEN: https://supabase.com/dashboard/account/tokens
name: Deploy recommend-spot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret (Dashboard -> Account -> Access Tokens)."
            exit 1
          fi
          supabase functions deploy recommend-spot --project-ref cxzpcsdydsrkthlenvrj

      - name: Smoke test (endpoint exists)
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X OPTIONS \
            "https://cxzpcsdydsrkthlenvrj.supabase.co/functions/v1/recommend-spot")
          echo "OPTIONS HTTP $code"
          if [ "$code" = "404" ]; then
            echo "::error::Function is still not found (404)."
            exit 1
          fi
