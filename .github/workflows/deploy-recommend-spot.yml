# Ручной деплой Edge Function `recommend-spot` в проект Supabase.
# Нужен секрет репозитория SUPABASE_ACCESS_TOKEN: https://supabase.com/dashboard/account/tokens
name: Deploy recommend-spot

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Добавьте секрет SUPABASE_ACCESS_TOKEN (Dashboard → Account → Access Tokens)."
            exit 1
          fi
          supabase functions deploy recommend-spot --project-ref cxzpcsdydsrkthlenvrj

      - name: Smoke test (endpoint exists)
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X OPTIONS \
            "https://cxzpcsdydsrkthlenvrj.supabase.co/functions/v1/recommend-spot")
          echo "OPTIONS HTTP $code"
          if [ "$code" = "404" ]; then
            echo "::error::Функция по-прежнему не найдена (404)."
            exit 1
          fi
