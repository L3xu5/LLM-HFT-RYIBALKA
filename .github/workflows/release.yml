# Релизные артефакты: статический web (dist/) + нативные сборки через EAS (облако Expo).
# Требуются секреты репозитория — см. README раздел «CI/CD».
# iOS в CI по умолчанию выключен (нет интерактива для Apple).
# Включение: переменная репозитория EAS_IOS_ENABLED=true или ручной запуск с галкой build_ios.
name: Release

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: Запустить EAS build для iOS (нужны credentials на expo.dev)
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  build-web:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Export web (static bundle)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY }}
        run: npm run build:web
      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: dist
          if-no-files-found: error

  # Релиз GitHub: сначала web zip (не ждёт EAS). APK добавляется отдельным job после сборки (см. attach-android-apk).
  github-release:
    name: GitHub Release (web)
    needs: build-web
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist

      - name: Pack web bundle for release
        run: |
          (cd web-dist && zip -r "${GITHUB_WORKSPACE}/rybalka-web-${{ github.ref_name }}.zip" .)

      - name: Create GitHub Release with assets
        uses: softprops/action-gh-release@v2
        with:
          files: rybalka-web-${{ github.ref_name }}.zip
          generate_release_notes: true
          fail_on_unmatched_files: true

  attach-android-apk:
    name: Attach APK to GitHub Release
    needs: [github-release, eas-android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: apk

      - name: Upload APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}" \
            "apk/rybalka-${{ github.ref_name }}.apk" \
            --clobber

  # Статика из dist/ → бакет Object Storage (AWS CLI + endpoint Yandex). Секреты — см. README.
  deploy-web-yandex:
    needs: build-web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: dist

      - name: Install AWS CLI
        run: |
          curl -sS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o awscliv2.zip
          unzip -q awscliv2.zip
          sudo ./aws/install --update

      - name: Sync to Yandex Object Storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.YANDEX_STORAGE_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.YANDEX_STORAGE_SECRET_ACCESS_KEY }}
          YANDEX_BUCKET: ${{ secrets.YANDEX_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${YANDEX_BUCKET:-}" ] || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "::notice::Не заданы YANDEX_STORAGE_BUCKET и/или ключи — выгрузка web в Object Storage пропущена (см. README)."
            exit 0
          fi
          aws s3 sync dist/ "s3://${YANDEX_BUCKET}/" \
            --endpoint-url https://storage.yandexcloud.net \
            --region ru-central1 \
            --delete

  eas-android:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: EAS Build (Android APK), wait and download
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY }}
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Задайте секрет EXPO_TOKEN (expo.dev → Access Tokens)."
            exit 1
          fi
          OUT_APK="rybalka-${{ github.ref_name }}.apk"
          # JSON на stdout; лог сборки — в stderr (--json в eas-cli)
          npx eas build \
            --platform android \
            --profile production-apk \
            --non-interactive \
            --wait \
            --json \
            -m "GitHub Actions ${{ github.workflow }} ${{ github.ref_name }} ${{ github.sha }}" \
            > eas-android-result.json
          APK_URL=$(jq -r '.[0].artifacts.applicationArchiveUrl // empty' eas-android-result.json)
          if [ -z "$APK_URL" ] || [ "$APK_URL" = "null" ]; then
            echo "::error::EAS не вернул applicationArchiveUrl"
            cat eas-android-result.json
            exit 1
          fi
          curl -fsSL "$APK_URL" -o "$OUT_APK"
          ls -la "$OUT_APK"

      - name: Upload APK artifact (GitHub Release / ручные прогоны)
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: rybalka-${{ github.ref_name }}.apk
          if-no-files-found: error

  eas-ios:
    needs: quality
    if: ${{ vars.EAS_IOS_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.build_ios == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci

      - name: EAS Build (iOS)
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY: ${{ secrets.EXPO_PUBLIC_YANDEX_MAPS_JS_API_KEY }}
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Задайте секрет EXPO_TOKEN (expo.dev → Access Tokens)."
            exit 1
          fi
          npx eas build --platform ios --profile production --non-interactive --no-wait
